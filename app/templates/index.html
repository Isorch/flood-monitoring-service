            position: absolute; top: 10px; right: 10px; z-index: 1000;

        }
        #info-panel h3 { margin: 0 0 8px 0; font-size: 16px; }
        .popup-btn {
            display: inline-block; margin: 4px 4px 0 0; padding: 6px 10px;
            background: #2c7be5; color: #fff; text-decoration: none;
            border-radius: 4px; font-size: 13px;
        }
        .popup-btn:hover { background: #1a5fc0; }
    </style>
